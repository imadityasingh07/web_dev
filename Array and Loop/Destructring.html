<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Destructuring</title>
  </head>
  <body>
    <script>
      let colors = ["red", "green", "blue"];
      let [firstColor, secondColor, thirdColor] = colors;
      console.log(firstColor);  // Output: red
      console.log(secondColor); // Output: green
      console.log(thirdColor);  // Output: blue
    </script>
  </body>
</html>
