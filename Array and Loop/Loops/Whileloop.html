<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Loops</title>
  </head>
  <body>
    <script>
      let num = 1; // Initialization
      while (num <= 10){ // Condition
        console.log(num);
        num = num + 1; // Increment/updating
      }
      console.log('final value of num is:'+ num);
      
    </script>
  </body>
</html>
