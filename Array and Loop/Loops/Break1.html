<!DOCTYPE html>
<html lang="en">

<head>
  <title>Break Loop</title>
</head>

<body>
  <script>
    let arr = [1, 2, 3, 4, 5];
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] === 3) {
        console.log(`Numbers found at index ${i}`);
        break; // exit the loop when arr[i] is 3
      }
      console.log('Still looking');
      
    }
  </script>
</body>

</html>
