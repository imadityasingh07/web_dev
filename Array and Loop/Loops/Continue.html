<!DOCTYPE html>
<html lang="en">
<head>
  <title>
    Continue Statement in Loops
  </title>
</head>
<body>
  <script>
    for(let i = 0; i < 25; i++){
      if(i % 2 === 0){
        continue; // Skip even numbers
      }
      console.log(i); // This will only log odd numbers
    }
  </script>
</body>
</html>
