<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Practice Exercise</title>

    <style>
      #my-button {
        height: 70px;
        width: 70px;
        font-size: 35px;
        border: none;
        border-radius: 5px;
      }

      .js-odd {
        background-color: lime;
      }

      .js-even {
        background-color: tomato;
      }
    </style>
  </head>

  <body>
    <h3 id="greeting"></h3>
    <button id="my-button" onclick="buttonPressed()"></button>

    <script>
      let noOfClicked = 0;
      function buttonPressed() {
        let button = document.querySelector("#my-button");
        noOfClicked++;
        uodateButton();
      }
      function uodateButton() {
        let button = document.querySelector("#my-button");
        if (noOfClicked % 2 === 0) {
          button.classList.add("js-even");
          button.classList.remove("js-odd");
        } else {
          button.classList.add("js-odd");
          button.classList.remove("js-even");
        }
        button.innerText = noOfClicked;
      }
    </script>
  </body>
</html>
