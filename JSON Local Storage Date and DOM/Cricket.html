<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Cricket Game</title>
    <style>
      body {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>

    <button onclick="playGame('Bat')">Bat</button>
    <button onclick="playGame('Ball')">Ball</button>
    <button onclick="playGame('Stump')">Stump</button>

    <br /><br />
    <button onclick="resetScore()">Reset Score</button>

    <script>
      
      let score = JSON.parse(localStorage.getItem("Score")) || {
        win: 0,
        lost: 0,
        tie: 0,
      };

      score.displayScore = function () {
        return `Won: ${this.win}, Lost: ${this.lost}, Tie: ${this.tie}`;
      };

      function generateComputerChoice() {
        let randomNumber = Math.floor(Math.random() * 3);
        if (randomNumber === 0) return "Bat";
        if (randomNumber === 1) return "Ball";
        return "Stump";
      }

      function getResult(userMove, computerMove) {
        if (userMove === computerMove) {
          score.tie++;
          return "It's a tie";
        }

        if (
          (userMove === "Bat" && computerMove === "Ball") ||
          (userMove === "Ball" && computerMove === "Stump") ||
          (userMove === "Stump" && computerMove === "Bat")
        ) {
          score.win++;
          return "User won.";
        } else {
          score.lost++;
          return "Computer has won";
        }
      }

      function playGame(userMove) {
        let computerChoice = generateComputerChoice();
        let resultMsg = getResult(userMove, computerChoice);

        localStorage.setItem("Score", JSON.stringify(score));

        alert(
          `You chose ${userMove}
Computer chose ${computerChoice}

${resultMsg}
${score.displayScore()}`
        );
      }

      function resetScore() {
        score = { win: 0, lost: 0, tie: 0 };
        localStorage.removeItem("Score");
        alert("Score reset successfully");
      }
    </script>
  </body>
</html>
