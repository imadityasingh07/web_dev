<!doctype html>
<html lang="en">
  <head>
    <title>Advanced Functions</title>
  </head>
  <body>
    <script>
      let add = function (num1, num2) {
        return num1 + num2;
      };
      let newadd = add;

      console.log(add(5, 10));
      console.log(newadd(10, 20));
    </script>
  </body>
</html>
