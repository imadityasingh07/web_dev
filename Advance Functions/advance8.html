<!doctype html>
<html lang="en">
  <head>
    <title>set Timeout-1</title>
  </head>
  <body>
    <script>
      let alarm = () => console.log(`Subah ho gayi,uth jao. ${new Date()}`);
      let inervalid = setInterval(alarm, 1000);
      setTimeout(() => clearInterval(inervalid), 5000);
    </script>
  </body>
</html>
