<!doctype html>
<html lang="en">
  <head>
    <title>For Each loop</title>
  </head>
  <body>
    <script>
      let arr = [3, 5, 7, 9, 11];
      function search(arr, num) {
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === num) {
            console.log(`element found at: ${i}`);
            return;
          }
        }
        console.log(`element not found`);
      }
      search(arr, 9);
    </script>
  </body>
</html>
