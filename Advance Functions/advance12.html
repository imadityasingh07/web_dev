<!doctype html>
<html lang="en">
  <head>
    <title>For Each loop</title>
  </head>
  <body>
    <script>
      let arr = [1,2,3,4,5,6,7,8,9];
      arr.forEach(num => {
        if(num === 9){
          return;
        }
       console.log(`visited:${num}`);
      });
      function search(arr, num) {
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === num) {
            console.log(`element found at: ${i}`);
            return;
          }
        }
        console.log(`element not found`);
      }
      search(arr, 9);
    </script>
  </body>
</html>
