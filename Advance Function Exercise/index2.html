<!doctype html>
<html lang="en">
  <head>
    <title>Exercise-2</title>
    <style>
      .btn-subscribe {
        font-size: 15px;
        height: 20px;
        width: 80px;
        background-color: rgb(217, 17, 17);
        color: white;
        border: none;
        border-radius: 4px;
      }

      .js-size-double {
        font-size: 30px;
        height: 40px;
        width: 160px;
      }
    </style>
  </head>

  <body>
    <button class="btn-subscribe" onclick="setTimeout(doubleTheSize, 2000)">
      Subscribe
    </button>
    <script>
      function doubleTheSize() {
        let buttonElement = document.querySelector(".btn-subscribe");
        buttonElement.classList.add("js-size-double");
      }
    </script>
  </body>
</html>
